<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Casebook Cockpit — Placement Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16233A; --ink-2:#1E3050; --paper:#EFF1F4; --surface:#FFFFFF;
  --amber:#E8A93B; --amber-deep:#C8862A; --teal:#0E7C7B; --teal-soft:#E2F0EF;
  --slate:#5A6577; --line:#DDE1E7; --line-soft:#E9ECF1;
  --easy:#2E8B6B; --med:#C8862A; --hard:#C0524A;
  --shadow:0 1px 2px rgba(22,35,58,.06),0 8px 24px rgba(22,35,58,.06);
  --shadow-lg:0 12px 48px rgba(22,35,58,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}
.disp{font-family:'Space Grotesk',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:26px;padding:0 6px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--amber);
  display:grid;place-items:center;color:var(--ink);font-weight:700;font-family:'Space Grotesk';
  flex-shrink:0;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}
.brand h1{font-family:'Space Grotesk';font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.brand h1 span{display:block;font-size:10.5px;font-weight:400;color:#9FB0C9;letter-spacing:.06em;
  text-transform:uppercase;margin-top:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:9px;
  color:#AEBBD0;font-size:14px;font-weight:500;transition:.15s;text-align:left;width:100%}
.nav-item .ic{width:19px;text-align:center;font-size:15px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--ink-2);color:#fff}
.nav-item.active .ic{filter:drop-shadow(0 0 6px rgba(232,169,59,.7))}
.rail-foot{margin-top:auto;padding:14px 8px 2px;border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;color:#7D8DA8;line-height:1.5}
.rail-foot b{color:#AEBBD0;font-weight:600}

.main{min-width:0;padding:30px 38px 90px;max-width:1180px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.topbar .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);
  font-weight:600;font-family:'JetBrains Mono'}
.topbar h2{font-family:'Space Grotesk';font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:5px}
.topbar p{color:var(--slate);font-size:14px;margin-top:4px;max-width:560px}

/* ---------- readiness header chip ---------- */
.ready-chip{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:13px 18px;box-shadow:var(--shadow)}
.ring{--p:0;width:54px;height:54px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(var(--teal) calc(var(--p)*1%), var(--line-soft) 0);
  display:grid;place-items:center}
.ring::after{content:"";position:absolute;width:40px;height:40px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;z-index:1;font-family:'Space Grotesk';font-size:14px;font-weight:600}
.ready-chip .lbl{font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.ready-chip .val{font-family:'Space Grotesk';font-size:15px;font-weight:600;margin-top:1px}

/* ---------- cards / grid ---------- */
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel-p{padding:20px}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px}
.section-h h3{font-family:'Space Grotesk';font-size:17px;font-weight:600}
.section-h .hint{font-size:12px;color:var(--slate)}

/* stat tiles */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--slate);font-weight:600}
.stat .v{font-family:'Space Grotesk';font-size:34px;font-weight:600;letter-spacing:-.02em;margin-top:6px;line-height:1}
.stat .sub{font-size:12px;color:var(--slate);margin-top:5px}
.stat .edge{position:absolute;left:0;top:0;bottom:0;width:4px}

/* progress bars per type */
.bar-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.bar-row:last-child{border-bottom:none}
.bar-row .nm{width:120px;font-size:13px;font-weight:600;flex-shrink:0}
.bar{flex:1;height:9px;background:var(--line-soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#13988f);border-radius:6px;transition:width .5s}
.bar-row .pct{width:78px;text-align:right;font-family:'JetBrains Mono';font-size:12px;color:var(--slate)}

/* due queue */
.due-item{display:flex;align-items:center;gap:13px;padding:12px 14px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface);margin-bottom:9px;transition:.15s}
.due-item:hover{border-color:var(--amber);box-shadow:0 4px 14px rgba(232,169,59,.12)}
.due-item .tag{font-family:'JetBrains Mono';font-size:11px;font-weight:600;color:var(--slate);width:46px}
.due-item .t{flex:1;font-size:14px;font-weight:500}
.due-item .when{font-size:11px;font-weight:600;color:var(--hard);font-family:'JetBrains Mono'}

/* ---------- filters ---------- */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  box-shadow:var(--shadow);margin-bottom:18px}
.filter-group+.filter-group{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.filter-group .glbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--slate);
  font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:500;border:1.5px solid var(--line);
  background:var(--surface);color:var(--slate);transition:.13s;white-space:nowrap}
.chip:hover{border-color:var(--slate)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on.amber{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.filters .clear{font-size:12px;color:var(--teal);font-weight:600;margin-left:auto}
.results-meta{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--slate)}
.results-meta b{color:var(--ink);font-family:'Space Grotesk'}

/* ---------- case cards ---------- */
.case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px 17px;
  box-shadow:var(--shadow);cursor:pointer;transition:.16s;position:relative;display:flex;flex-direction:column;gap:10px}
.ccard:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(22,35,58,.13);border-color:#C7CEDA}
.ccard .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ccard .cid{font-family:'JetBrains Mono';font-size:11px;font-weight:600;color:var(--slate);
  background:var(--paper);padding:2px 7px;border-radius:5px}
.ccard .title{font-family:'Space Grotesk';font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.ccard .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--paper);color:var(--slate)}
.pill.type{background:rgba(22,35,58,.06);color:var(--ink)}
.pill.diff-Easy{background:rgba(46,139,107,.13);color:var(--easy)}
.pill.diff-Med{background:rgba(200,134,42,.14);color:var(--med)}
.pill.diff-Hard{background:rgba(192,82,74,.13);color:var(--hard)}
.ccard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:9px;
  border-top:1px solid var(--line-soft)}
.status-dot{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.status-dot .d{width:8px;height:8px;border-radius:50%;background:var(--line)}
.st-Mastered .d{background:var(--teal)} .st-Mastered{color:var(--teal)}
.st-Reviewed .d{background:var(--amber)} .st-Reviewed{color:var(--amber-deep)}
.st-Attempting .d{background:#8094B4} .st-Attempting{color:#5A6577}
.ccard .due-flag{font-family:'JetBrains Mono';font-size:10.5px;font-weight:600;color:#fff;
  background:var(--hard);padding:2px 7px;border-radius:5px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,40,.55);backdrop-filter:blur(3px);
  display:none;z-index:50;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;
  border-radius:18px 18px 0 0;box-shadow:var(--shadow-lg);animation:rise .28s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{transform:translateY(34px);opacity:.6}to{transform:translateY(0);opacity:1}}
@media(min-width:760px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet-h{padding:22px 26px 18px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;
  background:var(--surface);z-index:2}
.sheet-h .x{position:absolute;right:18px;top:18px;width:32px;height:32px;border-radius:8px;
  display:grid;place-items:center;color:var(--slate);font-size:18px;background:var(--paper)}
.sheet-h .x:hover{background:var(--line-soft);color:var(--ink)}
.sheet-h .cid{font-family:'JetBrains Mono';font-size:11px;font-weight:600;color:var(--slate)}
.sheet-h h3{font-family:'Space Grotesk';font-size:22px;font-weight:600;letter-spacing:-.02em;margin:5px 0 9px;padding-right:40px}
.sheet-body{padding:22px 26px 30px}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.lead{background:var(--paper);border-radius:12px;padding:15px 17px;font-size:14px;color:#34425C;margin:6px 0 20px;
  border-left:3px solid var(--amber)}
.lead b{color:var(--ink)}
.step-h{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--slate);font-weight:700;
  font-family:'JetBrains Mono';margin:0 0 11px;display:flex;align-items:center;gap:9px}
.step-h .n{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;display:grid;
  place-items:center;font-size:11px}

/* attempt + timer */
.attempt-box{border:1px dashed var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.timer{font-family:'Space Grotesk';font-size:30px;font-weight:600;letter-spacing:.01em}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:9px;font-size:13.5px;
  font-weight:600;transition:.14s}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:var(--ink-2)}
.btn-amber{background:var(--amber);color:var(--ink)}
.btn-amber:hover{background:var(--amber-deep);color:#fff}
.btn-ghost{background:var(--paper);color:var(--ink)}
.btn-ghost:hover{background:var(--line-soft)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* blur-reveal scaffold (signature) */
.reveal-wrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:4px}
.reveal-content{padding:18px 19px;transition:filter .45s ease, opacity .45s}
.reveal-content.locked{filter:blur(9px);opacity:.55;user-select:none;pointer-events:none}
.reveal-veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:13px;text-align:center;padding:24px;background:rgba(244,245,247,.4)}
.reveal-veil.hide{display:none}
.reveal-veil .lk{font-size:24px}
.reveal-veil p{font-size:13.5px;color:var(--slate);max-width:330px}
.scaffold-step{font-size:14px;color:#33415A;padding:9px 0;border-bottom:1px solid var(--line-soft);
  display:flex;gap:11px}
.scaffold-step:last-child{border-bottom:none}
.scaffold-step .b{color:var(--teal);font-weight:700;font-family:'JetBrains Mono';flex-shrink:0}
.book-ref{font-size:12.5px;color:var(--slate);margin-top:14px;background:var(--teal-soft);
  border-radius:9px;padding:11px 14px;display:flex;align-items:center;gap:9px}
.book-ref b{color:var(--teal)}

/* confidence rating */
.rate{margin-top:22px;padding-top:20px;border-top:1px solid var(--line-soft)}
.rate-btns{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.rate-btn{flex:1;min-width:54px;padding:12px 6px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--surface);text-align:center;transition:.13s}
.rate-btn:hover{border-color:var(--teal);background:var(--teal-soft)}
.rate-btn.sel{border-color:var(--teal);background:var(--teal);color:#fff}
.rate-btn .num{font-family:'Space Grotesk';font-size:18px;font-weight:600;display:block}
.rate-btn .cap{font-size:10px;color:var(--slate);margin-top:2px}
.rate-btn.sel .cap{color:rgba(255,255,255,.85)}
.sched-note{margin-top:13px;font-size:13px;color:var(--teal);font-weight:600;display:none}
.sched-note.show{display:block}

/* industries */
.ind-card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:17px 18px;
  box-shadow:var(--shadow)}
.ind-card h4{font-family:'Space Grotesk';font-size:16px;font-weight:600;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between}
.ind-card .reg{font-size:10.5px;font-family:'JetBrains Mono';color:#fff;background:var(--teal);
  padding:2px 8px;border-radius:5px;font-weight:500}
.ind-row{font-size:13px;color:#34425C;padding:6px 0;border-top:1px solid var(--line-soft);display:flex;gap:9px}
.ind-row .l{color:var(--slate);font-weight:600;width:78px;flex-shrink:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}

/* profile */
.prof-section{margin-bottom:14px}
.prof-head{display:flex;align-items:center;gap:12px;padding:15px 18px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);cursor:pointer;transition:.14s}
.prof-head:hover{border-color:#C7CEDA}
.prof-head .ic{font-size:20px}
.prof-head .nm{font-family:'Space Grotesk';font-size:16px;font-weight:600;flex:1}
.prof-head .cnt{font-family:'JetBrains Mono';font-size:12px;color:var(--slate)}
.prof-head .pbar{width:80px;height:7px;background:var(--line-soft);border-radius:5px;overflow:hidden}
.prof-head .pbar i{display:block;height:100%;background:var(--amber);border-radius:5px}
.prof-head .chev{color:var(--slate);transition:.2s;font-size:13px}
.prof-section.open .chev{transform:rotate(90deg)}
.prof-body{display:none;padding:6px 4px 4px}
.prof-section.open .prof-body{display:block}
.pq{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.pq:last-child{border-bottom:none}
.pq .qcheck{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;margin-top:1px;
  display:grid;place-items:center;font-size:12px;color:#fff;transition:.14s}
.pq.done .qcheck{background:var(--teal);border-color:var(--teal)}
.pq .qt{flex:1;font-size:13.5px}
.pq .qt .cat{font-size:10.5px;font-family:'JetBrains Mono';color:var(--amber-deep);font-weight:600;
  text-transform:uppercase;letter-spacing:.04em}
.pq .qt .q{margin-top:2px;color:#2A3855;line-height:1.4}
.pq.done .qt .q{color:var(--slate);text-decoration:line-through;text-decoration-color:var(--line)}
.pq .wl{font-size:10.5px;font-family:'JetBrains Mono';color:var(--slate);flex-shrink:0;margin-top:2px}

/* bottom nav (mobile) */
.botnav{display:none}

/* responsive */
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding:20px 16px 88px}
  .topbar h2{font-size:24px}
  .cols-4{grid-template-columns:repeat(2,1fr)}
  .cols-3{grid-template-columns:1fr}
  .cols-2{grid-template-columns:1fr}
  .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ink);z-index:40;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;
    box-shadow:0 -4px 18px rgba(0,0,0,.18)}
  .botnav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#8294B0;
    font-size:10px;font-weight:600;padding:5px 9px;border-radius:9px;flex:1}
  .botnav button .ic{font-size:18px}
  .botnav button.active{color:var(--amber)}
  .mobile-ready{display:flex !important}
}
@media(min-width:861px){.mobile-only{display:none}}
.mobile-ready{display:none}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="app">
  <!-- RAIL -->
  <aside class="rail">
    <div class="brand">
      <div class="mark disp">C</div>
      <h1>Casebook Cockpit<span>Placement Prep</span></h1>
    </div>
    <button class="nav-item active" data-view="dashboard"><span class="ic">◎</span> Dashboard</button>
    <button class="nav-item" data-view="cases"><span class="ic">▦</span> Cases</button>
    <button class="nav-item" data-view="guess"><span class="ic">≈</span> Guesstimates</button>
    <button class="nav-item" data-view="industries"><span class="ic">⬡</span> Industry Knowledge</button>
    <button class="nav-item" data-view="profile"><span class="ic">◑</span> Profile Builder</button>
    <div class="rail-foot">
      <b>Proof of concept.</b> Progress is saved on this device. Case content stays in your own copy of the casebook — this indexes & schedules it.
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main"></main>
</div>

<!-- bottom nav -->
<nav class="botnav">
  <button class="active" data-view="dashboard"><span class="ic">◎</span>Home</button>
  <button data-view="cases"><span class="ic">▦</span>Cases</button>
  <button data-view="guess"><span class="ic">≈</span>Guess</button>
  <button data-view="industries"><span class="ic">⬡</span>Industry</button>
  <button data-view="profile"><span class="ic">◑</span>Profile</button>
</nav>

<!-- modal -->

    const last=new Date(today); last.setDate(last.getDate()-[2,6,1,9,3,1][Object.keys(seed).indexOf(id)]);
    store.progress[id]=mkProgress(c, last);
  }
  save();
}
function mkProgress(conf, lastDate){
  const last = lastDate||new Date();
  const next = new Date(last); next.setDate(next.getDate()+ (SR_INTERVALS[conf]||3));
  const status = conf>=5?"Mastered": conf>=3?"Reviewed":"Attempting";
  return {confidence:conf, status, last:last.toISOString(), next:next.toISOString(),
          attempts:(1)};
}
function statusOf(id){return (store.progress[id]&&store.progress[id].status)||"Not started";}
function isDue(id){const p=store.progress[id]; if(!p||!p.next) return false; return new Date(p.next)<=new Date();}
function dueIn(id){const p=store.progress[id]; if(!p||!p.next) return null;
  const d=Math.ceil((new Date(p.next)-new Date())/(864e5)); return d;}

/* ---------- view state ---------- */
let view='dashboard';
let filters={domain:new Set(), type:new Set(), diff:new Set(), status:new Set()};
const $=s=>document.querySelector(s);
const main=$('#main');

function setView(v){
  view=v; filters={domain:new Set(),type:new Set(),diff:new Set(),status:new Set()};
  document.querySelectorAll('.nav-item,[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  render(); window.scrollTo(0,0);
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));

/* ---------- render router ---------- */
function render(){
  if(view==='dashboard') return renderDash();
  if(view==='cases') return renderCases();
  if(view==='guess') return renderGuess();
  if(view==='industries') return renderIndustries();
  if(view==='profile') return renderProfile();
}

/* ---------- dashboard ---------- */
function pct(n,d){return d? Math.round(100*n/d):0;}
function renderDash(){
  const cases=DATA.cases;
  const mastered=cases.filter(c=>statusOf(c.id)==='Mastered').length;
  const inprog=cases.filter(c=>['Attempting','Reviewed'].includes(statusOf(c.id))).length;
  const readiness=pct(mastered, cases.length);
  // due queue across cases + guesstimates
  const allItems=[...cases.map(c=>({id:c.id,title:c.title,tag:c.id})),
                  ...DATA.guesstimates.map(g=>({id:g.id,title:g.title,tag:g.id}))];
  const due=allItems.filter(i=>isDue(i.id)).sort((a,b)=>(dueIn(a.id))-(dueIn(b.id)));
  // by type
  const byType=DATA.caseTypes.map(t=>{
    const cs=cases.filter(c=>c.type===t);
    const m=cs.filter(c=>['Mastered','Reviewed'].includes(statusOf(c.id))).length;
    return {t, m, n:cs.length, p:pct(m,cs.length)};
  });
  // profile readiness
  let pqTotal=0, pqDone=0;
  DATA.profile.forEach(s=>s.qs.forEach((q,i)=>{pqTotal++; if(store.profile[s.id+'_'+i]) pqDone++;}));

  main.innerHTML=`
  <div class="topbar">
    <div>
      <div class="eyebrow">IIM-C Casebook 2024-25 · Ed.5</div>
      <h2>Your readiness cockpit</h2>
      <p>Practise with active recall, then let spaced repetition decide what comes back. ${due.length} item${due.length!==1?'s':''} due today.</p>
    </div>
    <div class="ready-chip">
      <div class="ring" style="--p:${readiness};position:relative;display:grid;place-items:center">
        <b class="disp">${readiness}%</b></div>
      <div><div class="lbl">Case readiness</div><div class="val">${mastered}/${cases.length} mastered</div></div>
    </div>
  </div>

  <div class="grid cols-4">
    <div class="stat"><div class="edge" style="background:var(--teal)"></div>
      <div class="k">Cases mastered</div><div class="v">${mastered}</div><div class="sub">of ${cases.length} in library</div></div>
    <div class="stat"><div class="edge" style="background:var(--amber)"></div>
      <div class="k">In progress</div><div class="v">${inprog}</div><div class="sub">attempting or reviewing</div></div>
    <div class="stat"><div class="edge" style="background:var(--hard)"></div>
      <div class="k">Due for review</div><div class="v">${due.length}</div><div class="sub">surfaced by spacing</div></div>
    <div class="stat"><div class="edge" style="background:var(--ink)"></div>
      <div class="k">Profile answers</div><div class="v">${pqDone}</div><div class="sub">of ${pqTotal} prepared</div></div>
  </div>

  <div class="grid cols-2" style="margin-top:18px;align-items:start">
    <div class="panel panel-p">
      <div class="section-h" style="margin:0 0 8px"><h3>Due for review</h3>
        <button class="btn btn-amber mobile-only" onclick="practiceNext()" style="padding:6px 12px;font-size:12px">Practise next</button></div>
      <p style="font-size:12.5px;color:var(--slate);margin-bottom:14px">The spacing engine resurfaces items just before you'd forget them. Clear these first.</p>
      <div id="dueList">${ due.length? due.slice(0,6).map(i=>{
          const di=dueIn(i.id);
          return `<div class="due-item" onclick="openItem('${i.id}')">
            <span class="tag">${i.tag}</span><span class="t">${i.title}</span>
            <span class="when">${di<=0?'DUE':di+'d'}</span></div>`;
        }).join('') : `<div style="padding:24px;text-align:center;color:var(--slate);font-size:13px">Nothing due — you're ahead. Start a fresh case from the Cases tab.</div>`}</div>
      <button class="btn btn-primary" style="margin-top:6px;width:100%;justify-content:center" onclick="practiceNext()">▷ Start a mixed practice session</button>
    </div>

    <div class="panel panel-p">
      <div class="section-h" style="margin:0 0 14px"><h3>Mastery by case type</h3></div>
      ${byType.map(b=>`<div class="bar-row">
        <span class="nm">${b.t}</span>
        <span class="bar"><i style="width:${b.p}%"></i></span>
        <span class="pct">${b.m}/${b.n}</span></div>`).join('')}
      <div class="bar-row" style="border-top:2px solid var(--line);margin-top:6px;padding-top:14px">
        <span class="nm" style="color:var(--amber-deep)">Profile bank</span>
        <span class="bar"><i style="width:${pct(pqDone,pqTotal)}%;background:var(--amber)"></i></span>
        <span class="pct">${pqDone}/${pqTotal}</span></div>
    </div>
  </div>`;
}

function practiceNext(){
  const pool=[...DATA.cases, ...DATA.guesstimates];
  const due=pool.filter(i=>isDue(i.id));
  const fresh=DATA.cases.filter(c=>statusOf(c.id)==='Not started');
  const pick = due[0] || fresh[Math.floor(Math.random()*fresh.length)] || pool[0];
  openItem(pick.id);
}

/* ---------- filters UI ---------- */
function chip(label, group, value, amber){
  const on=filters[group].has(value);
  return `<button class="chip ${on?'on':''} ${amber&&on?'amber':''}" onclick="toggleFilter('${group}','${value.replace(/'/g,"\\'")}')">${label}</button>`;
}
window.toggleFilter=(g,v)=>{filters[g].has(v)?filters[g].delete(v):filters[g].add(v); render();};
window.clearFilters=()=>{filters={domain:new Set(),type:new Set(),diff:new Set(),status:new Set()};render();};

function casePasses(c){
  if(filters.domain.size && !filters.domain.has(c.domain)) return false;
  if(filters.type.size && !filters.type.has(c.type)) return false;
  if(filters.diff.size && !filters.diff.has(c.difficulty)) return false;
  if(filters.status.size){const s=isDue(c.id)?'Due':statusOf(c.id); if(!filters.status.has(s)) return false;}
  return true;
}

/* ---------- cases ---------- */
function renderCases(){
  const domains=[...new Set(DATA.cases.map(c=>c.domain))].sort();
  const list=DATA.cases.filter(casePasses);
  const active=filters.domain.size+filters.type.size+filters.diff.size+filters.status.size;
  main.innerHTML=`
  <div class="topbar"><div>
    <div class="eyebrow">${DATA.cases.length} cases · 5 types · ${domains.length} domains</div>
    <h2>Case library</h2>
    <p>Toggle filters to build a focused set, open a case, attempt it cold, then reveal the framework scaffold.</p>
  </div></div>

  <div class="filters">
    <div class="filter-group"><div class="glbl">⬡ Domain ${filters.domain.size?`· ${filters.domain.size} on`:''}</div>
      <div class="chips">${domains.map(d=>chip(d,'domain',d,true)).join('')}</div></div>
    <div class="filter-group"><div class="glbl">▦ Case type</div>
      <div class="chips">${DATA.caseTypes.map(t=>chip(t,'type',t)).join('')}</div></div>
    <div class="filter-group" style="display:flex;gap:30px;flex-wrap:wrap">
      <div><div class="glbl">Difficulty</div><div class="chips">${DATA.difficulties.map(d=>chip(d==='Med'?'Medium':d,'diff',d)).join('')}</div></div>
      <div><div class="glbl">Status</div><div class="chips">${['Due','Not started','Attempting','Reviewed','Mastered'].map(s=>chip(s,'status',s)).join('')}</div></div>
      ${active?`<button class="clear" onclick="clearFilters()" style="align-self:flex-end;margin-left:auto">Clear all (${active})</button>`:''}
    </div>
  </div>

  <div class="results-meta"><b>${list.length}</b> case${list.length!==1?'s':''} shown</div>
  <div class="case-grid">
    ${list.map(c=>caseCard(c)).join('') || `<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--slate)">No cases match these filters. <button class="clear" onclick="clearFilters()">Clear</button></div>`}
  </div>`;
}
function caseCard(c){
  const st=statusOf(c.id), due=isDue(c.id);
  return `<div class="ccard" onclick="openItem('${c.id}')">
    <div class="row1"><span class="cid">${c.id}</span>
      ${due?`<span class="due-flag">DUE</span>`:''}</div>
    <div class="title">${c.title}</div>
    <div class="meta"><span class="pill type">${c.type}</span>
      <span class="pill diff-${c.difficulty}">${c.difficulty==='Med'?'Medium':c.difficulty}</span></div>
    <div class="foot">
      <span class="status-dot st-${st.replace(' ','')}"><span class="d"></span>${st}</span>
      <span style="font-size:11px;color:var(--slate)" class="mono">p.${c.page}</span></div>
  </div>`;
}

/* ---------- guesstimates ---------- */
function guessPasses(g){
  if(filters.domain.size && !filters.domain.has(g.domain)) return false;
  if(filters.diff.size && !filters.diff.has(g.difficulty)) return false;
  return true;
}
function renderGuess(){
  const domains=[...new Set(DATA.guesstimates.map(g=>g.domain))].sort();
  const list=DATA.guesstimates.filter(guessPasses);
  main.innerHTML=`
  <div class="topbar"><div>
    <div class="eyebrow">${DATA.guesstimates.length} market-sizing drills</div>
    <h2>Guesstimates</h2>
    <p>Estimate the number out loud first. Only then open the approach hint and rate how close your structure was.</p>
  </div></div>
  <div class="filters">
    <div class="filter-group"><div class="glbl">⬡ Domain</div>
      <div class="chips">${domains.map(d=>chip(d,'domain',d,true)).join('')}</div></div>
    <div class="filter-group"><div class="glbl">Difficulty</div>
      <div class="chips">${DATA.difficulties.map(d=>chip(d==='Med'?'Medium':d,'diff',d)).join('')}</div></div>
  </div>
  <div class="results-meta"><b>${list.length}</b> drills shown</div>
  <div class="case-grid">${list.map(g=>{
    const st=statusOf(g.id),due=isDue(g.id);
    return `<div class="ccard" onclick="openItem('${g.id}')">
      <div class="row1"><span class="cid">${g.id}</span>${due?`<span class="due-flag">DUE</span>`:''}</div>
      <div class="title">${g.title}</div>
      <div class="meta"><span class="pill type">${g.type}</span>
        <span class="pill diff-${g.difficulty}">${g.difficulty==='Med'?'Medium':g.difficulty}</span>
        <span class="pill">${g.domain}</span></div>
      <div class="foot"><span class="status-dot st-${st.replace(' ','')}"><span class="d"></span>${st}</span></div>
    </div>`;
  }).join('')}</div>`;
}

/* ---------- industries ---------- */
function renderIndustries(){
  main.innerHTML=`
  <div class="topbar"><div>
    <div class="eyebrow">${DATA.industries.length} industry primers</div>
    <h2>Industry knowledge</h2>
    <p>Quick-reference structure for each sector — value chain, the metrics that matter, and the regulator. Fill the detail from your notes.</p>
  </div></div>
  <div class="grid cols-3">${DATA.industries.map(i=>`
    <div class="ind-card">
      <h4>${i.name} ${i.regulator!=='—'?`<span class="reg">${i.regulator}</span>`:''}</h4>
      <div class="ind-row"><span class="l">Key metrics</span><span>${i.metrics}</span></div>
      <div class="ind-row"><span class="l">Value chain</span><span style="color:var(--slate)">add from notes →</span></div>
      <div class="ind-row"><span class="l">Casebook</span><span class="mono" style="font-size:12px">p.${i.page}</span></div>
    </div>`).join('')}</div>`;
}

/* ---------- profile ---------- */
function renderProfile(){
  main.innerHTML=`
  <div class="topbar"><div>
    <div class="eyebrow">Master profile builder · ${DATA.profile.reduce((a,s)=>a+s.qs.length,0)}+ prompts</div>
    <h2>Profile builder</h2>
    <p>Work through each section. Tick a prompt once you have a tight, rehearsed answer. (Full 239-question bank lives in the Excel database.)</p>
  </div></div>
  ${DATA.profile.map((s,si)=>{
    const done=s.qs.filter((q,i)=>store.profile[s.id+'_'+i]).length;
    return `<div class="prof-section" id="ps_${si}">
      <div class="prof-head" onclick="document.getElementById('ps_${si}').classList.toggle('open')">
        <span class="ic">${s.icon}</span>
        <span class="nm">${s.name}</span>
        <span class="pbar"><i style="width:${pct(done,s.qs.length)}%"></i></span>
        <span class="cnt">${done}/${s.qs.length}</span>
        <span class="chev">▸</span>
      </div>
      <div class="prof-body">
        ${s.qs.map((q,i)=>{
          const key=s.id+'_'+i, on=!!store.profile[key];
          return `<div class="pq ${on?'done':''}" onclick="toggleQ('${key}')">
            <div class="qcheck">${on?'✓':''}</div>
            <div class="qt"><div class="cat">${q.cat||''}</div><div class="q">${q.q}</div></div>
            ${q.wl?`<div class="wl">${(''+q.wl).replace('.0','')}w</div>`:''}
          </div>`;
        }).join('')}
      </div></div>`;
  }).join('')}`;
}
window.toggleQ=(key)=>{store.profile[key]=!store.profile[key]; if(!store.profile[key])delete store.profile[key]; save();
  const sec=document.querySelector('.prof-section.open'); renderProfile();
  if(sec){const id=sec.id; const el=document.getElementById(id); if(el)el.classList.add('open');}};

/* ---------- item modal (case or guesstimate) ---------- */
let current=null;
function findItem(id){return DATA.cases.find(c=>c.id===id)||DATA.guesstimates.find(g=>g.id===id);}
window.openItem=(id)=>{
  const it=findItem(id); if(!it) return; current=id;
  const isCase=id[0]==='C';
  const fw=isCase? it.framework : 'Guesstimate';
  const scaffold = isCase? (FW_SCAFFOLD[it.framework]||FW_SCAFFOLD["Case Themes"]) :
    ["State the final number's structure first (e.g. supply-side vs demand-side).",
     "Break the population / base into segments you can size.",
     "Apply rates per segment; keep round numbers; multiply up.",
     "Sanity-check the magnitude against something you know."];
  const st=statusOf(id);
  const sheet=$('#sheet');
  sheet.innerHTML=`
   <div class="sheet-h">
     <button class="x" onclick="closeSheet()">✕</button>
     <div class="cid">${it.id} · ${isCase?it.type:it.type} ${isCase?'· '+it.domain:'· '+it.domain}</div>
     <h3>${it.title}</h3>
     <div class="kv">
       ${isCase?`<span class="pill type">${it.framework}</span>`:''}
       <span class="pill diff-${it.difficulty}">${it.difficulty==='Med'?'Medium':it.difficulty}</span>
       ${isCase?`<span class="pill">Casebook p.${it.page}</span>`:''}
       <span class="status-dot st-${st.replace(' ','')}" style="margin-left:4px"><span class="d"></span>${st}</span>
     </div>
   </div>
   <div class="sheet-body">
     <div class="lead">${isCase?
        `Set this up as if it's a live interview: read the prompt to your partner, ask clarifying questions, then <b>structure your approach before revealing anything below.</b>`:
        `Say your <b>estimate and its structure out loud</b> before you reveal the approach. The reveal is a scaffold, not the answer.`}</div>

     <div class="attempt-box">
       <div class="step-h"><span class="n">1</span> Attempt it cold</div>
       <div class="btn-row">
         <div class="timer mono" id="timer">00:00</div>
         <button class="btn btn-ghost" id="timerBtn" onclick="toggleTimer()">▷ Start timer</button>
         <span style="font-size:12px;color:var(--slate)">Target: ${isCase?'20–25 min':'4–6 min'}</span>
       </div>
     </div>

     <div class="step-h"><span class="n">2</span> Reveal the ${isCase?'framework scaffold':'approach'}</div>
     <div class="reveal-wrap">
       <div class="reveal-content locked" id="revealC">
         ${scaffold.map((s,i)=>`<div class="scaffold-step"><span class="b">${i+1}</span><span>${s}</span></div>`).join('')}
         ${isCase?`<div class="book-ref">📖 <span>Compare your structure with the full worked solution in the casebook — <b>page ${it.page}</b>.</span></div>`:
                  `<div class="book-ref">💡 <span><b>Hint:</b> ${it.hint}</span></div>`}
       </div>
       <div class="reveal-veil" id="veil">
         <span class="lk">🔒</span>
         <p>Structure your own answer first. Revealing before you attempt defeats the recall benefit.</p>
         <button class="btn btn-amber" onclick="reveal()">I've attempted it — reveal</button>
       </div>
     </div>

     <div class="rate" id="rateBox">
       <div class="step-h"><span class="n">3</span> Rate your confidence — sets the next review</div>
       <div class="rate-btns">
         ${[[1,'Lost'],[2,'Shaky'],[3,'OK'],[4,'Solid'],[5,'Nailed it']].map(([n,c])=>
           `<button class="rate-btn" data-n="${n}" onclick="rate(${n})"><span class="num">${n}</span><span class="cap">${c}</span></button>`).join('')}
       </div>
       <div class="sched-note" id="schedNote"></div>
     </div>
   </div>`;
  $('#scrim').classList.add('open');
  stopTimer(); timerSec=0; $('#timer')&&($('#timer').textContent='00:00');
};
window.closeSheet=()=>{$('#scrim').classList.remove('open'); stopTimer(); render();};
$('#scrim').onclick=(e)=>{if(e.target.id==='scrim')closeSheet();};

window.reveal=()=>{$('#revealC').classList.remove('locked'); $('#veil').classList.add('hide');};

/* timer */
let timerSec=0, timerInt=null;
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
window.toggleTimer=()=>{
  const btn=$('#timerBtn');
  if(timerInt){stopTimer(); btn.textContent='▷ Resume';}
  else{timerInt=setInterval(()=>{timerSec++; $('#timer').textContent=fmt(timerSec);},1000); btn.textContent='❚❚ Pause';}
};
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null;}}

/* rating → schedule */
window.rate=(n)=>{
  document.querySelectorAll('.rate-btn').forEach(b=>b.classList.toggle('sel', +b.dataset.n===n));
  // ensure revealed
  reveal();
  const today=new Date();
  store.progress[current]=mkProgress(n, today);
  save();
  const days=SR_INTERVALS[n];
  const next=new Date(today); next.setDate(next.getDate()+days);
  const note=$('#schedNote');
  note.classList.add('show');
  note.textContent=`✓ Saved as “${store.progress[current].status}”. Next review in ${days} day${days>1?'s':''} (${next.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}).`;
};

setView('dashboard');
</script>
</body>
</html>
