<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PlaceMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0e1a2b; --ink-2: #1f2d44; --ink-soft: #4a5567;
    --paper: #fafaf7; --card: #ffffff;
    --line: #e3e1da; --line-strong: #c9c5b8;
    --amber: #c98a2b; --amber-soft: #f3e5c4;
    --teal: #2a7f7a; --teal-soft: #d6ebe9;
    --warn: #a14a2a;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --body: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
  button { font-family: var(--body); cursor: pointer; }

  .topbar { border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; background: var(--card); position: sticky; top: 0; z-index: 50; }
  .brand { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .brand .dot { color: var(--amber); }
  .nav-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; }

  .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }

  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; background: var(--ink); color: var(--paper); border: 1px solid var(--ink); font-family: var(--body); font-size: 14px; font-weight: 500; border-radius: 0; transition: background 0.15s; }
  .btn:hover { background: var(--ink-2); }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn.ghost:hover { background: var(--paper); }
  .btn.amber { background: var(--amber); border-color: var(--amber); color: white; }
  .btn.amber:hover { background: #b07820; border-color: #b07820; }

  .back { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); background: none; border: none; padding: 0; margin-bottom: 20px; cursor: pointer; }
  .back:hover { color: var(--ink); }

  .dash-header { margin-bottom: 32px; }
  .dash-header h1 { font-family: var(--display); font-weight: 600; font-size: 28px; margin: 0 0 6px; letter-spacing: -0.015em; }
  .dash-header p { color: var(--ink-soft); margin: 0; font-size: 14px; max-width: 640px; }

  .section-label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin: 28px 0 12px; }

  .type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .type-card { background: var(--card); padding: 20px; cursor: pointer; transition: background 0.15s; display: flex; flex-direction: column; gap: 6px; }
  .type-card:hover { background: var(--paper); }
  .type-card.disabled { cursor: not-allowed; opacity: 0.45; }
  .type-card .name { font-family: var(--display); font-weight: 500; font-size: 15px; }
  .type-card .count { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .type-card .status { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--amber); margin-top: 4px; }

  .mode-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 20px 0 32px; }
  .mode-tab { background: var(--card); padding: 16px 20px; cursor: pointer; }
  .mode-tab.active { background: var(--ink); color: var(--paper); }
  .mode-tab .mode-name { font-family: var(--display); font-weight: 500; font-size: 14px; }
  .mode-tab .mode-desc { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .mode-tab.active .mode-desc { color: rgba(255,255,255,0.7); }

  .case-list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .case-row { background: var(--card); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .case-row:hover { background: var(--paper); }
  .case-row .case-title { font-family: var(--display); font-weight: 500; font-size: 15px; }
  .case-row .case-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  .difficulty { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border: 1px solid var(--line-strong); text-transform: uppercase; letter-spacing: 0.06em; }
  .difficulty.easy { color: var(--teal); border-color: var(--teal); }
  .difficulty.medium { color: var(--amber); border-color: var(--amber); }
  .difficulty.hard { color: var(--warn); border-color: var(--warn); }

  .learn-section { background: var(--card); border: 1px solid var(--line); padding: 24px; margin-bottom: 24px; }
  .learn-section h2 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0 0 4px; }
  .learn-section .sublabel { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 16px; }

  .tree { font-family: var(--mono); font-size: 13px; line-height: 1.7; }
  .tree ul { list-style: none; padding-left: 18px; margin: 0; border-left: 1px solid var(--line); }
  .tree > ul { padding-left: 0; border-left: none; }
  .tree li { position: relative; padding-left: 14px; }
  .tree li::before { content: '─'; position: absolute; left: 0; color: var(--line-strong); }
  .tree > ul > li::before { content: ''; }
  .node { display: inline-block; cursor: pointer; padding: 2px 6px; transition: background 0.1s; }
  .node:hover { background: var(--paper); }
  .node.root { font-weight: 600; color: var(--ink); }
  .node.key { color: var(--amber); font-weight: 600; }
  .node.hit { background: var(--teal-soft); }
  .node-note { color: var(--ink-soft); font-style: italic; margin-left: 8px; font-size: 11px; }
  .node-expand { display: inline-block; width: 16px; color: var(--ink-soft); font-family: var(--mono); font-size: 11px; user-select: none; }

  .problem-bar { background: var(--ink); color: var(--paper); padding: 20px 24px; margin-bottom: 24px; }
  .problem-bar .label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--amber-soft); }
  .problem-bar .stmt { font-family: var(--display); font-size: 17px; margin-top: 6px; font-weight: 500; line-height: 1.4; }

  .practice-grid { display: grid; grid-template-columns: 1fr 300px; gap: 24px; }
  .practice-grid.no-rail { grid-template-columns: 1fr; }

  .step-card { background: var(--card); border: 1px solid var(--line); padding: 24px; margin-bottom: 16px; }
  .step-card h3 { font-family: var(--display); font-weight: 600; font-size: 16px; margin: 0 0 4px; }
  .step-card .step-sub { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 14px; }
  .step-card textarea { width: 100%; min-height: 120px; padding: 12px 14px; border: 1px solid var(--line-strong); background: var(--paper); font-family: var(--body); font-size: 14px; border-radius: 0; resize: vertical; line-height: 1.5; }
  .step-card textarea:focus { outline: 1px solid var(--ink); border-color: var(--ink); }
  .step-card .step-actions { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }

  .facts-list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .fact-item { background: var(--card); padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .fact-item:hover { background: var(--paper); }
  .fact-item .fact-ask { font-size: 14px; flex: 1; }
  .fact-item .fact-toggle { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); border: 1px solid var(--line-strong); padding: 3px 8px; }
  .fact-item.revealed { background: var(--paper); }
  .fact-item.revealed .fact-toggle { color: var(--teal); border-color: var(--teal); }
  .fact-reveal { background: var(--paper); padding: 0 16px; max-height: 0; overflow: hidden; transition: max-height 0.2s, padding 0.2s; font-size: 14px; color: var(--ink-2); }
  .fact-reveal.open { max-height: 200px; padding: 12px 16px; border-top: 1px solid var(--line); }

  .rail { background: var(--card); border: 1px solid var(--line); padding: 20px; height: fit-content; position: sticky; top: 80px; }
  .rail h3 { font-family: var(--display); font-size: 13px; font-weight: 600; margin: 0 0 4px; }
  .rail .sub { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 14px; }
  .rail .tree { font-size: 11px; line-height: 1.6; }

  .reveal-wrap { margin-top: 32px; }
  .reveal-wrap h2 { font-family: var(--display); font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .reveal-wrap .sub { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 16px; }
  .legend { display: flex; gap: 16px; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin-bottom: 14px; flex-wrap: wrap; }
  .legend-swatch { display: inline-block; width: 14px; height: 14px; vertical-align: middle; margin-right: 4px; }
  .legend-swatch.hit { background: var(--teal-soft); }
  .legend-swatch.key { background: var(--amber); }

  .answer-block { background: var(--paper); border-left: 3px solid var(--amber); padding: 16px 20px; margin-top: 20px; font-size: 14px; line-height: 1.65; color: var(--ink-2); }
  .answer-block h4 { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin: 0 0 10px; }

  .recs-box { background: var(--paper); border: 1px solid var(--line); padding: 16px; margin-top: 16px; }
  .recs-box h4 { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin: 0 0 8px; }
  .recs-box ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .recs-box li { margin-bottom: 4px; }

  .self-check { background: var(--card); border: 1px solid var(--line); padding: 20px; margin-top: 20px; }
  .self-check h4 { font-family: var(--display); font-size: 14px; margin: 0 0 12px; }
  .self-check .your-attempt { background: var(--paper); padding: 12px; margin-bottom: 12px; font-size: 13px; white-space: pre-wrap; border: 1px solid var(--line); }
  .self-check .check-row { display: flex; gap: 8px; align-items: center; margin: 8px 0; font-size: 14px; }
  .self-check input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--ink); }

  .footer-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }

  @media (max-width: 720px) {
    .practice-grid { grid-template-columns: 1fr; }
    .rail { position: static; }
    .mode-row { grid-template-columns: 1fr; }
    .container { padding: 20px 16px 60px; }
  }
  .settings-btn { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); background: none; border: 1px solid var(--line); padding: 6px 12px; }
  .settings-btn:hover { color: var(--ink); border-color: var(--line-strong); }
  .settings-card { background: var(--card); border: 1px solid var(--line); padding: 24px; max-width: 520px; }
  .settings-card label { display: block; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 6px; }
  .settings-card input, .settings-card select { width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); font-family: var(--mono); font-size: 13px; background: var(--paper); }
  .settings-card .hint { font-size: 12px; color: var(--ink-soft); margin-top: 8px; line-height: 1.5; }
  .settings-actions { display: flex; gap: 10px; margin-top: 18px; }

  .scaffold-row { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
  .keynote { background: var(--amber-soft); border-left: 3px solid var(--amber); padding: 10px 14px; font-size: 13px; margin-bottom: 18px; }
  .keynote a { color: var(--ink); text-decoration: underline; cursor: pointer; }

  .chat { border: 1px solid var(--line); background: var(--paper); padding: 14px; max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 88%; }
  .bubble.assistant { align-self: flex-start; }
  .bubble.user { align-self: flex-end; }
  .bubble .who { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 3px; }
  .bubble.user .who { text-align: right; }
  .bubble .msg { display: inline-block; padding: 9px 13px; font-size: 14px; line-height: 1.5; border: 1px solid var(--line); background: var(--card); white-space: pre-wrap; }
  .bubble.user .msg { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chat-input { display: flex; gap: 8px; margin-top: 12px; }
  .chat-input textarea { flex: 1; resize: none; min-height: 44px; max-height: 120px; padding: 10px 12px; border: 1px solid var(--line-strong); font-family: var(--body); font-size: 14px; }
  .chat-input.disabled textarea { background: var(--paper); color: var(--ink-soft); }
  .chat-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }

  .diagram-scroll { overflow: auto; border: 1px solid var(--line); background: var(--card); padding: 8px; max-height: 560px; }
  svg.diagram { display: block; }

  .scorecard { margin: 18px 0; }
  .ladder { display: inline-block; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding: 5px 12px; margin-bottom: 12px; border: 1px solid var(--line-strong); }
  .ladder.shaky { background: #f3ddd6; color: #9c3a26; }
  .ladder.developing { background: var(--amber-soft); color: #8a5a14; }
  .ladder.solid { background: var(--teal-soft); color: #1c5f5a; }
  .ladder.strong { background: #dbe8d2; color: #3a6a2c; }
  .ladder.mastered { background: var(--ink); color: var(--paper); }
  .sc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .sc-cols h4 { font-family: var(--display); font-size: 13px; margin: 0 0 6px; }
  .sc-cols ul { margin: 0; padding-left: 16px; font-size: 13px; line-height: 1.5; }
  .legend-swatch { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: middle; border: 1px solid var(--line-strong); }
  .legend-swatch.correct { background: #14346b; }
  .legend-swatch.wrong { background: #c0392b; }
  @media (max-width: 600px) { .sc-cols { grid-template-columns: 1fr; } }
  .signin-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .signin-card { background: var(--card); border: 1px solid var(--line); padding: 36px 32px; width: 100%; max-width: 380px; }
  .signin-card .logo { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; margin-bottom: 4px; }
  .signin-card .logo .dot { color: var(--amber); }
  .signin-card .tagline { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 26px; }
  .signin-card label { display: block; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin: 14px 0 6px; }
  .signin-card input { width: 100%; padding: 11px 13px; border: 1px solid var(--line-strong); font-family: var(--body); font-size: 14px; background: var(--paper); }
  .signin-card input:focus { outline: 2px solid var(--teal); outline-offset: 0; border-color: transparent; }
  .signin-card .btn { width: 100%; justify-content: center; margin-top: 22px; }
  .signin-err { color: var(--warn); font-size: 13px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" onclick="go('dashboard')" style="cursor:pointer">Place<span class="dot">Me</span></div>
  <div style="display:flex; gap:8px;">
    <button class="settings-btn" onclick="go('settings')">⚙ Settings</button>
    <button class="settings-btn" onclick="signOut()">Sign out</button>
  </div>
</div>

<div id="app"></div>

<script>
const CASE_PACKS = [
  {
    "id": "profitability-delhi-metro",
    "type": "profitability",
    "title": "Delhi Metro profitability",
    "industry": "Public transport",
    "difficulty": "medium",
    "prompt": "The Delhi Metro has been seeing falling profits over the last few quarters. Find out why and recommend a fix.",
    "facts": [
      {
        "ask": "Operating geography and scope",
        "reveal": "Operates across the Delhi NCR network; no recent change in route footprint"
      },
      {
        "ask": "Revenue vs cost trend",
        "reveal": "Costs are largely flat in real terms; revenue per ride has fallen"
      },
      {
        "ask": "Revenue breakdown",
        "reveal": "Revenue = riders × avg fare; ridership has dropped while fare structure is unchanged"
      },
      {
        "ask": "Rider segments",
        "reveal": "Daily commuter ridership has fallen; tourist/occasional ridership is stable"
      },
      {
        "ask": "Competition / substitutes",
        "reveal": "Ride-share and bike-taxi options have expanded routes that overlap with metro corridors"
      },
      {
        "ask": "Customer journey friction",
        "reveal": "Last-mile connectivity (station to office) is the main weak point reported by lapsed commuters"
      }
    ],
    "answer_key": "A profitability case where cost is stable and the revenue decline is volume-driven, not price-driven. Segmentation shows the loss is concentrated in daily commuters rather than tourists. Externally, competing modes have improved exactly on the dimension where metro is weakest — door-to-door convenience. The crux is that last-mile connectivity is the real switching driver: commuters aren't leaving over fare or in-train experience, they're leaving because the full journey door-to-door is faster on a competing mode.",
    "solution_flowchart": {
      "label": "Profit decline (Delhi Metro)",
      "status": "root",
      "children": [
        {
          "label": "Cost",
          "note": "flat",
          "status": "branch",
          "children": []
        },
        {
          "label": "Revenue",
          "note": "declined",
          "status": "branch",
          "children": [
            {
              "label": "Ridership down (fare unchanged)",
              "status": "branch",
              "children": [
                {
                  "label": "Daily commuters, not tourists",
                  "status": "branch",
                  "children": [
                    {
                      "label": "External: competing modes expanded",
                      "status": "branch",
                      "children": [
                        {
                          "label": "Last-mile convenience gap is the switching driver",
                          "status": "key",
                          "children": []
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }
      ]
    },
    "recs": [
      "Partner with bike-share and e-rickshaw operators to integrate last-mile pickup at high-loss stations",
      "Bundle a commuter pass with a last-mile credit allowance to lock in repeat ridership"
    ]
  },
  {
    "id": "profitability-tractor-insurance",
    "type": "profitability",
    "title": "Tractor insurance provider",
    "industry": "Insurance",
    "difficulty": "hard",
    "prompt": "A tractor insurance provider has seen profits decline over the past year. Find the root cause and recommend a fix.",
    "facts": [
      {
        "ask": "Client background and how long has this been going on",
        "reveal": "Sells tractor insurance nationally; issue has persisted for about a year"
      },
      {
        "ask": "Customer base",
        "reveal": "Customers are rural, farming households"
      },
      {
        "ask": "Competitive landscape",
        "reveal": "Four other insurers hold roughly equal share; no single player dominates"
      },
      {
        "ask": "Industry-wide or company-specific",
        "reveal": "Every insurer in the space is seeing the same decline"
      },
      {
        "ask": "Distribution model",
        "reveal": "No direct agent force; sells through partner bank branches and similar tie-ups"
      },
      {
        "ask": "Revenue vs cost split",
        "reveal": "Costs are flat; the decline is entirely on the revenue side"
      },
      {
        "ask": "Revenue driver breakdown",
        "reveal": "Premium revenue depends on customer count, premium per installment, and installment frequency; customer count is the piece that has fallen"
      },
      {
        "ask": "Supply or demand issue (insurance)",
        "reveal": "No capacity constraint on the selling side — this is a demand-side drop"
      },
      {
        "ask": "Where in the customer journey is the drop",
        "reveal": "The need for insurance itself has weakened, even though every other step in the journey is unchanged"
      },
      {
        "ask": "What drives the number of policies needed",
        "reveal": "Policy count tracks tractor purchases; tractor purchases themselves have fallen"
      },
      {
        "ask": "Supply or demand for tractors",
        "reveal": "No supply constraint on tractors — again a demand-side issue"
      },
      {
        "ask": "What is weakening in the tractor purchase journey",
        "reveal": "Affordability has dropped for prospective buyers"
      },
      {
        "ask": "Financing details",
        "reveal": "Most farmers finance tractor purchases through loans from local banks rather than cash"
      },
      {
        "ask": "What changed in the loan terms",
        "reveal": "Loan principal is unchanged, but interest rates charged have risen"
      },
      {
        "ask": "Why did rates rise",
        "reveal": "A bad monsoon hurt farmer incomes, driving up loan defaults, which pushed local banks to raise interest rates"
      }
    ],
    "answer_key": "Two-layer profitability case: the insurer's revenue decline is a downstream symptom of a demand shock one level removed, in the tractor-purchase market itself. The candidate needs to run the customer-journey framework twice — once for insurance buying, once for tractor buying — to land on the real root cause. The crux is realising that 'flat industry, no competitor issue, no supply issue' rules out the obvious levers and forces a look upstream: insurance demand is gated by tractor demand, which is gated by financing affordability.",
    "solution_flowchart": {
      "label": "Profit decline (tractor insurer)",
      "status": "root",
      "children": [
        {
          "label": "Cost",

/* ---------- AI interviewer ---------- */
function buildInterviewerPrompt(c) {
  const facts = c.facts.map((f, i) => `  ${i + 1}. If they ask about "${f.ask}": ${f.reveal}`).join("\n");
  return `You are a top management-consulting case interviewer running a live interview. Stay fully in character as the interviewer.

The problem you have already given the candidate: "${c.prompt}"

Data you hold — reveal a point ONLY when the candidate asks a question that targets it. Never volunteer data, never list it, never dump several at once. If their question is vague, ask them to be more specific instead of handing it over:
${facts}

The strong solution path (for YOUR judgement only — NEVER state it, NEVER hint the route): ${c.answer_key}

Rules:
- Do not lead. If the candidate proposes a structure, pressure-test it ("why that bucket?", "is that exhaustive?").
- Reveal at most one relevant fact per turn, tied to what they asked.
- If they are stuck for two turns, nudge with a question, not the answer.
- Keep every reply to 1-3 sentences, like a real interviewer across the table.
- The candidate has a limited number of questions, so be crisp.
- Never reveal the answer, the ideal structure, or that you are an AI.`;
}

async function callLLM(messages, { json = false, temperature = 0.7 } = {}) {
  if (!state.apiKey) throw new Error("No API key");
  const body = { model: state.model, messages, temperature };
  if (json) body.response_format = { type: "json_object" };
  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.apiKey },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    if (res.status === 401) throw new Error("Invalid API key — check Settings");
    const t = await res.text().catch(() => "");
    throw new Error("API " + res.status + " " + t.slice(0, 120));
  }
  const data = await res.json();
  return data.choices?.[0]?.message?.content ?? "";
}

async function sendTurn() {
  if (state.busy) return;
  const ta = document.getElementById("chat-text");
  if (!ta) return;
  const text = ta.value.trim();
  if (!text || state.promptsUsed >= PROMPT_LIMIT) return;
  state.messages.push({ role: "user", content: text });
  state.promptsUsed++;
  state.busy = true;
  render();
  try {
    const msgs = [{ role: "system", content: buildInterviewerPrompt(state.selectedCase) }, ...state.messages];
    const reply = await callLLM(msgs, { temperature: 0.7 });
    state.messages.push({ role: "assistant", content: reply });
  } catch (e) {
    state.messages.push({ role: "assistant", content: "[" + e.message + "]" });
  }
  state.busy = false;
  render();
}

async function endAndScore() {
  if (state.busy) return;
  const c = state.selectedCase;
  const hasAttempt = state.apiKey && state.messages.some(m => m.role === "user");
  if (hasAttempt) {
    state.busy = true; render();
    try {
      const labels = collectLabels(c.solution_flowchart);
      const transcript = state.messages.map(m => (m.role === "assistant" ? "INTERVIEWER" : "CANDIDATE") + ": " + m.content).join("\n");
      const out = await callLLM([
        { role: "system", content: "You assess a case-interview transcript. Reply with ONLY valid JSON, no prose." },
        { role: "user", content:
`Assess the candidate against this case's solution flowchart.

Problem: ${c.prompt}
Strong path: ${c.answer_key}

Solution flowchart nodes (use these labels EXACTLY as written, copy them verbatim):
${labels.map(l => "- " + l).join("\n")}

Candidate's opening structure (may be blank): ${state.structureText || "(none written)"}

Transcript:
${transcript}

Return JSON exactly in this shape:
{"correct":[labels the candidate clearly reasoned through correctly],
 "wrong":[labels they got wrong, contradicted, or should have reached but never did],
 "overall":"<one of: shaky|developing|solid|strong|mastered>",
 "strengths":["short point","..."],
 "improvements":["short point","..."]}
Only use labels from the list above. Any label not in "correct" or "wrong" is treated as not reached. Be honest — most attempts are developing or solid.` }
      ], { json: true, temperature: 0.2 });
      const data = JSON.parse(out);
      const ns = {};
      (data.correct || []).forEach(l => { ns[l] = "correct"; });
      (data.wrong || []).forEach(l => { if (!ns[l]) ns[l] = "wrong"; });
      state.nodeStates = ns;
      state.assessment = {
        overall: (data.overall || "developing").toLowerCase(),
        strengths: data.strengths || [],
        improvements: data.improvements || []
      };
    } catch (e) {
      state.assessment = { overall: "developing", strengths: [], improvements: ["Couldn't auto-score: " + e.message] };
    }
    state.busy = false;
  }
  state.revealed = true;
  render();
}

}
function saveSettings() {
  state.apiKey = document.getElementById("key-input").value.trim();
  state.model = document.getElementById("model-input").value;
  localStorage.setItem("cpe.key", state.apiKey);
  localStorage.setItem("cpe.model", state.model);
  const note = document.getElementById("save-note");
  if (note) note.textContent = "Saved.";
}
function clearKey() {
  state.apiKey = "";
  localStorage.setItem("cpe.key", "");   // persist removal so the built-in key doesn't reload
  render();
}
function restoreKey() {
  state.apiKey = DEFAULT_KEY;
  localStorage.removeItem("cpe.key");     // fall back to the built-in key
  render();
}

/* ---------- SVG diagram ---------- */
function collectLabels(n, acc = []) { acc.push(n.label); (n.children || []).forEach(c => collectLabels(c, acc)); return acc; }

function layoutTree(root) {
  const NODE_W = 172, NODE_H = 60, H_GAP = 26, V_GAP = 38;
  const xs = NODE_W + H_GAP, ys = NODE_H + V_GAP;
  let cursor = 0, maxDepth = 0;
  const nodes = [], links = [];
  (function assign(n, depth, parent) {
    maxDepth = Math.max(maxDepth, depth);
    const rec = { node: n, depth, parent, xunit: 0 };
    nodes.push(rec);
    if (n.children && n.children.length) {
      const kids = n.children.map(c => assign(c, depth + 1, rec));
      rec.xunit = (kids[0].xunit + kids[kids.length - 1].xunit) / 2;
    } else {
      rec.xunit = cursor++;
    }
    return rec;
  })(root, 0, null);
  let maxLeft = 0;
  nodes.forEach(r => {
    r.left = 12 + r.xunit * xs;
    r.top = 12 + r.depth * ys;
    maxLeft = Math.max(maxLeft, r.left);
    if (r.parent) links.push([r.parent, r]);
  });
  return { nodes, links, width: maxLeft + NODE_W + 12, height: 12 + maxDepth * ys + NODE_H + 12, NODE_W, NODE_H };
}

function renderDiagram(root, opts = {}) {
  const L = layoutTree(root);
  const states = opts.states || {};
  let svg = `<svg class="diagram" width="${L.width}" height="${L.height}" viewBox="0 0 ${L.width} ${L.height}">`;
  L.links.forEach(([p, c]) => {
    const x1 = p.left + L.NODE_W / 2, y1 = p.top + L.NODE_H;
    const x2 = c.left + L.NODE_W / 2, y2 = c.top;
    const my = (y1 + y2) / 2;
    svg += `<path d="M${x1},${y1} L${x1},${my} L${x2},${my} L${x2},${y2}" fill="none" stroke="#c9c5b8" stroke-width="1.4"/>`;
  });
  L.nodes.forEach(r => {
    const n = r.node;
    const v = states[n.label];
    const isKey = n.status === "key";
    let fill = "#ffffff", txt = "#0e1a2b", stroke = "#c9c5b8", sw = 1.2;
    if (v === "correct") { fill = "#14346b"; txt = "#ffffff"; stroke = "#14346b"; sw = 1.4; }
    else if (v === "wrong") { fill = "#c0392b"; txt = "#ffffff"; stroke = "#c0392b"; sw = 1.4; }
    else if (isKey) { fill = "#f3e5c4"; }
    if (isKey) { stroke = "#c98a2b"; sw = 2.4; }
    const clickAttr = opts.clickToMark ? `data-clickmark="${escapeHtml(n.label)}" style="cursor:pointer"` : "";
    svg += `<g ${clickAttr}>`;
    svg += `<rect x="${r.left}" y="${r.top}" width="${L.NODE_W}" height="${L.NODE_H}" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    svg += textBlock(n.label, n.note, r.left + L.NODE_W / 2, r.top, L.NODE_H, txt);
    svg += `</g>`;
  });
  svg += `</svg>`;
  return `<div class="diagram-scroll">${svg}</div>`;
}

function textBlock(label, note, cx, top, h, color) {
  const max = 24;
  const words = String(label).split(/\s+/);
  let lines = [], cur = "";
  words.forEach(w => {
    if ((cur + " " + w).trim().length > max) { if (cur) lines.push(cur); cur = w; }
    else cur = (cur ? cur + " " : "") + w;
  });
  if (cur) lines.push(cur);
  if (lines.length > 3) { lines = lines.slice(0, 3); lines[2] = lines[2].slice(0, max - 1) + "…"; }
  const noteLine = (note && lines.length <= 2) ? note : null;
  const total = lines.length + (noteLine ? 1 : 0);
  const lh = 14;
  let y = top + h / 2 - ((total - 1) * lh) / 2;
  let out = "";
  lines.forEach(ln => {
    out += `<text x="${cx}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" font-family="Inter, sans-serif" fill="${color}">${escapeHtml(ln)}</text>`;
    y += lh;
  });
  if (noteLine) {
    out += `<text x="${cx}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="10" font-family="'JetBrains Mono', monospace" fill="${color}" opacity="0.72">${escapeHtml(noteLine)}</text>`;
  }
  return out;
}

function bindDiagram() {
  document.querySelectorAll("[data-clickmark]").forEach(g => {
    g.addEventListener("click", () => {
      const label = g.dataset.clickmark;
      if (state.nodeStates[label] === "correct") delete state.nodeStates[label];
      else state.nodeStates[label] = "correct";
      render();
    });
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

render();

</script>
